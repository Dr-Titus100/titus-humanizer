name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check skill metadata
        run: |
          name=$(sed -n 's/^name: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' skills/titus-humanizer/SKILL.md | head -n1)
          test "$name" = "titus-humanizer" || { echo "SKILL.md name is '$name'"; exit 1; }
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m py_compile skills/titus-humanizer/scripts/titus_tools.py
          printf 'It is not just a tool \xe2\x80\x94 it is a game-changer that leverages robust synergy to unlock value for every team in the organization today.\n' > sample.txt
          python3 skills/titus-humanizer/scripts/titus_tools.py score sample.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Build zip
        run: |
          cd skills
          zip -r ../titus-humanizer.zip titus-humanizer -x '*.DS_Store' -x '*__pycache__*'
          cd ..
          unzip -l titus-humanizer.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: titus-humanizer
          path: titus-humanizer.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" titus-humanizer.zip --clobber

      - name: Rebuild the website
        # Tells titus-web to rebuild, so the site picks up this release right away.
        # Needs a SITE_DISPATCH_TOKEN secret. Without it, the site picks up the release on its nightly build.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_TOKEN" ]; then
            echo "No SITE_DISPATCH_TOKEN secret, so titus-web will pick up $GITHUB_REF_NAME on its nightly build."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Dr-Titus100/titus-web/dispatches \
            -d "{\"event_type\":\"skill-released\",\"client_payload\":{\"skill\":\"titus-humanizer\",\"tag\":\"$GITHUB_REF_NAME\"}}"
          echo "Asked titus-web to rebuild with $GITHUB_REF_NAME."
