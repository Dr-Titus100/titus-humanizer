name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-24.04 still has Python 3.9, the oldest version the tests support.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Show any change to the stored example output
        if: failure()
        run: python tests/update_expected.py --check
